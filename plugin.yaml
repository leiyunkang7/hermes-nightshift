name: nightshift
version: "0.3.0"
description: "Async, persistent, interruptible delegated tasks with visible transcripts and resumption."
author: "leiyunkang7"
license: "MIT"

# Entry point — Hermes calls register(ctx) on plugin load
entry: "__init__:register"

# Slash commands this plugin adds
commands:
  - name: nightshift
    description: "Dispatch a delegated task in the background and return its task_id."
  - name: nightshift-status
    description: "List all nightshift runs, or show one run by id."
  - name: nightshift-tail
    description: "Show the last N lines of a run transcript (default 40)."
  - name: nightshift-pause
    description: "Request a single subagent to stop at its next iteration boundary."
  - name: nightshift-resume
    description: "Re-dispatch a paused run with its prior transcript packed into context= (Week 3)."
  - name: nightshift-inject
    description: "Stage new instructions for a live subagent (Week 2: disk-staged)."
